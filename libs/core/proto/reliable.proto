syntax = "proto3";
package reliable;

// Publisher -> SFU -> Subscriber (ordered/reliable channel framing)
message RelMsg {
  uint64 stream_id       = 1;
  uint64 seq             = 2;
  bytes  payload         = 3;
  bool   resync_required = 4;
}

// SFU wraps RelMsg before delivering to subscriber
message RelDelivery {
  string publisher_id = 1;
  bytes  frame        = 2; // encoded RelMsg
}

// Subscriber -> Publisher (retransmit request)
message RelNack {
  uint64 stream_id    = 1;
  uint64 from_seq     = 2;
  string publisher_id = 3;
}

message RelControl {
  oneof msg {
    RelNack nack = 1;
  }
}
