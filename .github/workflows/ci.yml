name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm dlx playwright` would fetch the LATEST playwright and install browser
      # revisions for it, which need not match the workspace's pinned
      # @playwright/test — the mismatch surfaces as "Executable doesn't exist at
      # .../chromium-XXXX" at run time. Install via each package that runs tests so
      # the binaries always match the version those tests resolve.
      - name: Install Playwright Browsers
        run: |
          pnpm --filter @pulsebeam/web exec playwright install --with-deps chromium
          pnpm --filter @pulsebeam/react exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm test

      # The SFU image is pinned by digest in libs/web/tests/playwright.config.ts.
      # Do NOT set IMAGE_TAG here — a second pin only drifts (this job used to force
      # `latest`, which does not match the client's signaling.proto).
      - name: Run Playwright tests e2e
        run: pnpm test:e2e

      - name: Upload All Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-playwright-reports
          path: libs/**/playwright-report/
          retention-days: 30

      - name: Create Release (Changesets)
        uses: changesets/action@v1.7.0
        with:
          publish: pnpm exec changeset publish
        env:
          # https://github.com/changesets/action/issues/542#issuecomment-3642334398
          NPM_TOKEN: ''
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: false

  # Browser QoE tests (real media via getStats) against a PINNED SFU build that
  # matches the client's signaling.proto. Isolated from `ci` so it never blocks the
  # release flow, and so a client-side regression is attributed clearly. The nightly
  # workflow runs the same specs against server `main` to catch server breakage.
  qoe-e2e:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm --filter @pulsebeam/web exec playwright install --with-deps chromium

      - name: Lint QoE test guardrails (no fixed sleeps)
        run: pnpm --filter @pulsebeam/web lint

      # No IMAGE_TAG: the SFU is pinned by immutable digest in
      # libs/web/tests/playwright.config.ts, which is the single source of truth.
      # Bump it there (and re-run this suite) when the proto or SFU behaviour changes.
      - name: Run QoE E2E (blocking lane, pinned SFU)
        run: pnpm --filter @pulsebeam/web test:e2e:qoe

      - name: Upload QoE report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qoe-playwright-report
          path: libs/web/playwright-report/
          retention-days: 30
